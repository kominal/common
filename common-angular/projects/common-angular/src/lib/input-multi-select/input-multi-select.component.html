@if (label(); as label) {
  <app-label [label]="label" [formElement]="formElement()" />
}
<p-multi-select
  [filter]="true"
  class="w-full"
  styleClass="w-full"
  appendTo="body"
  [formControl]="formElement()"
  [options]="options() || []"
  optionLabel="label"
  optionValue="value"
  [showClear]="!required()"
  panelStyleClass="w-full"
/>
